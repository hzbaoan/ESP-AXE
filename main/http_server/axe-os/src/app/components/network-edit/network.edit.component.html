<ng-container *ngIf="form != null">
    <form [formGroup]="form">

        <div class="field grid p-fluid">
            <label htmlFor="hostname" class="col-12 mb-2 md:col-2 md:mb-0">Hostname:</label>
            <div class="col-12 md:col-10">
                <input pInputText id="hostname" type="text" formControlName="hostname" />
            </div>
        </div>
        <div class="field grid p-fluid">
            <label htmlFor="ssid" class="col-12 mb-2 md:col-2 md:mb-0">Wi-Fi SSID:</label>
            <div class="col-12 md:col-10 p-inputgroup">
                <input pInputText id="ssid" type="text" formControlName="ssid" />
                <button pButton type="button" icon="pi pi-search" (click)="scanWifi()" [loading]="scanning"></button>
            </div>
        </div>
        <div class="field grid p-fluid">
            <label htmlFor="wifiPass" class="col-12 mb-2 md:col-2 md:mb-0">Wi-Fi Password:</label>
            <div class="col-12 md:col-10 p-input-icon-right">
                <i *ngIf="form.get('wifiPass')?.dirty" class="pi"
                   [ngClass]="{'pi-eye': !showWifiPassword, 'pi-eye-slash': showWifiPassword}"
                   (click)="toggleWifiPasswordVisibility()" style="cursor: pointer;"></i>
                <input pInputText id="wifiPass" formControlName="wifiPass"
                       [type]="showWifiPassword ? 'text' : 'password'"
                       placeholder="Enter Wi-Fi password" />
            </div>
        </div>
        <div class="field grid p-fluid align-items-center">
            <label htmlFor="socks5ProxyEnabled" class="col-12 mb-2 md:col-2 md:mb-0">SOCKS5 Proxy:</label>
            <div class="col-12 md:col-10">
                <p-inputSwitch inputId="socks5ProxyEnabled" formControlName="socks5ProxyEnabled"></p-inputSwitch>
            </div>
        </div>
        <ng-container *ngIf="form.get('socks5ProxyEnabled')?.value">
            <div class="field grid p-fluid">
                <label htmlFor="socks5ProxyHost" class="col-12 mb-2 md:col-2 md:mb-0">Proxy Host:</label>
                <div class="col-12 md:col-10">
                    <input pInputText id="socks5ProxyHost" type="text" formControlName="socks5ProxyHost" />
                </div>
            </div>
            <div class="field grid p-fluid">
                <label htmlFor="socks5ProxyPort" class="col-12 mb-2 md:col-2 md:mb-0">Proxy Port:</label>
                <div class="col-12 md:col-10">
                    <input pInputText id="socks5ProxyPort" type="number" formControlName="socks5ProxyPort" />
                </div>
            </div>
            <div class="field grid p-fluid">
                <label htmlFor="socks5ProxyUser" class="col-12 mb-2 md:col-2 md:mb-0">Proxy User:</label>
                <div class="col-12 md:col-10">
                    <input pInputText id="socks5ProxyUser" type="text" formControlName="socks5ProxyUser" />
                </div>
            </div>
            <div class="field grid p-fluid">
                <label htmlFor="socks5ProxyPass" class="col-12 mb-2 md:col-2 md:mb-0">Proxy Password:</label>
                <div class="col-12 md:col-10 p-input-icon-right">
                    <i *ngIf="form.get('socks5ProxyPass')?.dirty" class="pi"
                       [ngClass]="{'pi-eye': !showSocks5ProxyPassword, 'pi-eye-slash': showSocks5ProxyPassword}"
                       (click)="toggleSocks5ProxyPasswordVisibility()" style="cursor: pointer;"></i>
                    <input pInputText id="socks5ProxyPass" formControlName="socks5ProxyPass"
                           [type]="showSocks5ProxyPassword ? 'text' : 'password'"
                           placeholder="Enter proxy password" />
                </div>
            </div>
        </ng-container>

        <div class="mt-2">
            <button pButton [disabled]="!form.dirty || form.invalid" (click)="updateSystem()"
                class="btn btn-primary mr-2">Save</button>
            <b style="line-height: 34px;">You must restart this device after saving for changes to take effect.</b>
        </div>

        <div class="mt-2">
            <button pButton [disabled]="!savedChanges" (click)="restart()">Restart</button>
        </div>
    </form>
</ng-container>
